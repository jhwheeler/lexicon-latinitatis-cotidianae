name: Check lexicon
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate data and generated page
        run: python3 scripts/build.py --check
      - name: Test the builder
        run: python3 -m unittest discover -s tests -v
      - name: Compare vowel lengths with Lewis & Short
        run: python3 scripts/check_quantities.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The system packages are a convenience (extra fonts); when the runner cannot reach the Ubuntu mirrors,
      # the browser alone is enough for the tests.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Test search in Chromium
        run: npm test
