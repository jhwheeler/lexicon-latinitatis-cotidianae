   links:'Ad lexicon',practice:'Vocābulōrum exercitātiō',
   about:`<p>Rōmānī assem in duodecim ūnciās dīvidēbant, et suum cuique ūnciārum numerō nōmen erat: sextāns duās ūnciās valet, quadrāns trēs, deūnx ūndecim. Eōdem modō hōra in duodecim partēs dīviditur, ita ut ūncia hōrae quīnque minūtōrum sit: <i>hōra octāva cum sextante</i> est 8:10, <i>sexta cum besse</i> 6:40.</p><p>Hōrae partēs iīsdem nōminibus jam Plīnius appellat: lūnam in diēs singulōs <i>dōdrantēs sēmunciās hōrārum</i> diūtius lūcēre scrībit (Nat. II 58), alibī dōdrantem et dextantem hōrae nōminat (XVIII 219; 324). Sed spatia temporis sunt, nōn hōrae ex hōrologiō lēctae. Hōram et quadrantem vel dōdrantem dīcere recentiōrum est: <i>est prīma hōra et quadrāns</i> apud Traupman (<i>Conversational Latin</i>, p. 81), <i>hōra septima cum quadrante</i> apud Carolum Egger, <i>hōra nōna cum quadrante</i> apud Andresian (<i>Vocabula Picta</i>, p. 49). Omnēs ūnciās ad hōram trānstulit Jūstīnus Mansfield, ā quō Lūcius Rāniērius hanc ratiōnem didicit et cēterōs docuit. <i>Cum</i> ad partem addendam Plīnius quoque ūsurpat: <i>longissimus diēs est aequinoctiālium hōrārum XIIII atque dīmidiae cum trīcēsimā ūnius hōrae</i> (VI 214).</p><p>Hōrae: prīma, secunda, tertia, quārta, quīnta, sexta, septima, octāva, nōna, decima, ūndecima, duodecima. Notae sunt eae quae in nummīs aereīs līberae reī pūblicae cernuntur: S sēmissem significat, singulī globulī singulās ūnciās.</p>`},

const t=k=>T[lang][k];

/* the sign: S for six, a pellet per uncia, five set as on a die */
function notaSVG(n,h){
  if(!n) return '';
  h=h||18; let x=0, s='';
  if(n>=6){ s+=`<text x="0" y="14.5" font-size="18" font-family="Lexicon Serif,Georgia,serif" fill="currentColor">S</text>`; x=11; }
  const r=n%6;
  if(r===5){ [[0,0],[9,0],[4.5,4.5],[0,9],[9,9]].forEach(([a,b])=>{ s+=`<circle cx="${x+2.6+a}" cy="${4.4+b}" r="2.2" fill="currentColor"/>`; }); x+=15; }
  else { for(let i=0;i<r;i++) s+=`<circle cx="${x+3+i*7.5}" cy="9" r="2.5" fill="currentColor"/>`; x+=r?r*7.5:0; }
  return `<svg viewBox="0 0 ${x} 18" width="${(x*h/18).toFixed(1)}" height="${h}" aria-hidden="true">${s}</svg>`;
}

$('tb').innerHTML=F.map(([n,w,a])=>`<tr><td class="n">${n}</td><td>${w}</td><td>cum ${a}</td><td class="m">${n*5}</td><td class="nota">${notaSVG(n,16)}</td></tr>`).join('');

/* dial: twelve unciae round the hour; hands for clock questions */
function drawDial(o){
  const P=(a,r)=>`${(r*Math.sin(a)).toFixed(2)} ${(-r*Math.cos(a)).toFixed(2)}`;
  let s=`<circle r="57" fill="var(--sunk)" stroke="var(--line)"/>`;
  for(let i=0;i<12;i++){
    const a0=i/12*2*Math.PI, a1=(i+1)/12*2*Math.PI, on=o.show&&i<o.n;
    s+=`<path class="sec" d="M ${P(a0,24)} L ${P(a0,53)} A 53 53 0 0 1 ${P(a1,53)} L ${P(a1,24)} A 24 24 0 0 0 ${P(a0,24)} Z" fill="${on?'var(--verdigris)':'var(--verdigris-soft)'}" stroke="var(--sunk)" stroke-width="1.6"/>`;
  }
  s+=`<path d="M 0 -57 L 0 -49" stroke="var(--bronze)" stroke-width="2.4" stroke-linecap="round"/>`;
  if(o.show&&o.h){
    const mA=o.n*30, hA=((o.h%12)+o.n/12)*30;
    s+=`<line class="hand" x1="0" y1="6" x2="0" y2="-34" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" transform="rotate(${hA})"/>`;
    s+=`<line class="hand" x1="0" y1="8" x2="0" y2="-50" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" transform="rotate(${mA})"/>`;
    s+=`<circle r="3.6" fill="var(--bronze)"/>`;
  } else if(!o.show){
    s+=`<text x="0" y="7" text-anchor="middle" font-family="Lexicon Serif,Georgia,serif" font-size="22" fill="var(--muted)">?</text>`;
  } else if(o.n===0){ s+=`<circle r="3.6" fill="var(--bronze)"/>`; }
  const d=$('dial'); d.innerHTML=s;
  d.setAttribute('aria-label',o.show?(o.h?`${o.h}:${String(o.n*5).padStart(2,'0')}`:`${o.n}/12`):t('dialQ'));
  $('dialCap').innerHTML=o.show?(o.n?notaSVG(o.n,18):`<span>${t('full')}</span>`):'';
}

/* questions */
function pick(){
  const kinds=mode==='mix'?['n2w','w2n','t2w','w2t']:[mode];
  let k,n,h,key;
  do{
    k=kinds[Math.floor(Math.random()*kinds.length)];
    n=Math.floor(Math.random()*11)+1;
    h=Math.floor(Math.random()*12)+1;
    const clock=k==='t2w'||k==='w2t';
    if(clock&&$('whole').checked&&Math.random()<1/12) n=0;
    key=k+n+(clock?'@'+h:'');
  }while(key===last);
  last=key;
  const latin=n?`${ORD[h-1]} cum ${F[n-1][2]}`:ORD[h-1];
  const clock=`${h}:${String(n*5).padStart(2,'0')}`;
  if(k==='n2w') return {k,n,cue:String(n),num:true,ans:F[n-1][1],show:F[n-1][1],dialFirst:true};
  if(k==='w2n') return {k,n,cue:F[n-1][1],num:false,ans:String(n),show:String(n)};
  if(k==='t2w') return {k,n,h,cue:clock,num:true,ans:latin,show:'hōra '+latin,dialFirst:true};
  return {k,n,h,cue:'hōra '+latin,num:false,ans:clock,show:clock};
}
const numericAnswer=()=>q&&(q.k==='w2n'||q.k==='w2t');

function render(){
  if(!q) return;
  $('cueLabel').textContent=t('l_'+q.k);
  const c=$('cue'); c.textContent=q.cue; c.className='cue'+(q.num?' num':'');
  $('modeChip').firstElementChild.textContent=t('m_'+mode);
  $('go').textContent=answered?t('next'):t('check');
  $('keys').hidden=!$('mkeys').checked||numericAnswer();
}

function next(focus){
  q=pick(); answered=false;
  const inp=$('answer'), was=inp.inputMode, num=numericAnswer();
  inp.value=''; inp.readOnly=false;
  inp.inputMode=num?'numeric':'text';
  inp.className=num?'num':'';
  inp.placeholder=q.k==='w2t'?'7:45':q.k==='w2n'?'1–11':'';
  $('fb').innerHTML='';
  drawDial({n:q.n,h:q.h,show:!!q.dialFirst});
  render();
  if(focus){ if(was!==inp.inputMode&&document.activeElement===inp) inp.blur(); inp.focus({preventScroll:true}); }
}

/* checking */
const strip=s=>s.normalize('NFD').replace(/̄/g,'').normalize('NFC');
const clean=s=>s.normalize('NFC').toLowerCase().replace(/[.,;!?«»"]/g,' ').replace(/\s+/g,' ').trim();
const noHora=s=>s.split(' ').filter(w=>w!=='hōra'&&w!=='hora').join(' ');
function check(v){
  if(q.k==='w2n') return parseInt(v,10)===q.n?'ok':'no';
  if(q.k==='w2t'){
    const d=v.replace(/\D/g,''); if(!d) return 'no';
    const h=d.length<=2?+d:+d.slice(0,-2), m=d.length<=2?0:+d.slice(-2);
    return (h===q.h&&m===q.n*5)?'ok':'no';
  }
  const raw=clean(v), a=raw.split(' ').filter(w=>w!=='hōra').join(' '), target=clean(q.ans);
  if(a===target) return 'ok';
  if(strip(noHora(raw))===strip(target)) return $('strict').checked?'half':'ok-lax';
  return 'no';
}

function paint(){
  $('tOk').textContent=S.ok; $('tAll').textContent=S.all;
  const r=$('tRun'); r.textContent=S.run; r.classList.toggle('hot',S.run>=5); r.title=t('streak');
  $('mOk').textContent=S.ok; $('mAll').textContent=S.all; $('mRun').textContent=S.run; $('mBest').textContent=S.best;
}

function submit(){
  if(answered){ next(true); return; }
  const v=$('answer').value; if(!v.trim()) return;
  const r=check(v); answered=true;
  const good=r==='ok'||r==='ok-lax';
  S.all++; if(good){S.ok++;S.run++;S.best=Math.max(S.best,S.run);} else S.run=0;
  store.set('score',S); paint();
  const gloss=q.n?`${F[q.n-1][1]} · ${q.n} ${t('unc')} · ${q.n*5} ${t('min')}`:t('full');
  const head={ok:['ok',t('ok')],'ok-lax':['ok',t('okLax')+' '+t('okLaxNote')],half:['half',t('half')],no:['no',t('no')]}[r];
  $('fb').innerHTML=`<span class="v ${head[0]}">${head[1]}</span> <span class="sol">${q.show}</span><div class="gloss">${gloss}</div>`;
  drawDial({n:q.n,h:q.h,show:true});
  render();
}

/* language */
function applyLang(){
  document.documentElement.lang=lang==='la'?'la':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  $('about').innerHTML=t('about');
  $('openMenu').setAttribute('aria-label',t('menu'));
  $('closeMenu').setAttribute('aria-label',t('close'));
  $('answer').setAttribute('aria-label',t('answer'));
  $('links').setAttribute('aria-label',t('links'));
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  $('modeList').innerHTML=MODES.map(m=>`<label class="opt"><input type="radio" name="mode" value="${m}" ${m===mode?'checked':''}><span>${t('m_'+m)}${EX[m]?`<small>${EX[m]}</small>`:''}</span></label>`).join('');
  render(); paint();
  if(q) drawDial({n:q.n,h:q.h,show:answered||!!q.dialFirst});
}
function setLang(l){
  if(l===lang) return; lang=l; store.set('lang',l);
  if(location.hash!=='#'+l) location.hash=l;
  applyLang();
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h==='la'||h==='en') setLang(h); });

/* events */
const go=$('go');
go.addEventListener('pointerdown',e=>{ if(document.activeElement===$('answer')) e.preventDefault(); });
$('f').addEventListener('submit',e=>{ e.preventDefault(); submit(); });

$('answer').addEventListener('input',e=>{
  const el=e.target;
  if(q&&q.k==='w2t'){
    const d=el.value.replace(/\D/g,'').slice(0,4);
    const v=d.length>=3?d.slice(0,-2)+':'+d.slice(-2):d;
    if(v!==el.value){ el.value=v; el.setSelectionRange(v.length,v.length); }
    return;
  }
  if(q&&q.k==='w2n'){ const d=el.value.replace(/\D/g,'').slice(0,2); if(d!==el.value) el.value=d; return; }
  if(!$('mkeys').checked) return;
  const map={a:'ā',e:'ē',i:'ī',o:'ō',u:'ū',A:'Ā',E:'Ē',I:'Ī',O:'Ō',U:'Ū'};
  const v=el.value.replace(/([aeiouAEIOU])_/g,(m,c)=>map[c]);
  if(v!==el.value){ const pos=el.selectionStart-(el.value.length-v.length); el.value=v; el.setSelectionRange(pos,pos); }
});
$('keys').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
$('keys').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const el=$('answer'), s=el.selectionStart??el.value.length, en=el.selectionEnd??s;
  el.value=el.value.slice(0,s)+b.textContent+el.value.slice(en);
  el.focus(); el.setSelectionRange(s+1,s+1);
});

const menu=$('menu');
const openMenu=()=>{ try{menu.showModal()}catch(e){menu.setAttribute('open','')} };
$('openMenu').addEventListener('click',openMenu);
$('modeChip').addEventListener('click',openMenu);
$('closeMenu').addEventListener('click',()=>menu.close());
menu.addEventListener('click',e=>{ if(e.target===menu) menu.close(); });
$('modeList').addEventListener('change',e=>{
  if(e.target.name!=='mode') return;
  mode=e.target.value; store.set('mode',mode); last=''; next(false); menu.close();
});
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
$('strict').addEventListener('change',e=>store.set('strict',e.target.checked));
$('whole').addEventListener('change',e=>store.set('whole',e.target.checked));
$('mkeys').addEventListener('change',e=>{ store.set('mkeys',e.target.checked); render(); });
$('reset').addEventListener('click',()=>{ S.ok=S.all=S.run=S.best=0; store.set('score',S); paint(); });

applyLang(); next(false);

/* The lexicon's service worker keeps this page on the device with the rest, so the game works offline. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
