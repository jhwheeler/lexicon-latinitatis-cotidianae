<!-- Generated by scripts/build.py. Edit data/ and src/, then rebuild. -->
<!doctype html>
<html lang="la" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#f2f0eb">
{{theme}}
<script>
/* The game's theme is the lexicon's, set above as on every page: light unless the reader chose dark
   there, whatever the system prefers. The browser's bar takes the colour of the ground, as in the clock. */
if (document.documentElement.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#141311';
</script>
{{app}}
<style>
/* The gap games (lacūnae): short dialogues with gaps to fill. One engine, this template, makes a
   standalone page for each game in src/lacunae/ (scripts/build.py, gap_games): Ubi est Theodōrus? (20
   November 2026), the adverbs of place, built on a game Jack invented in conversation, and Quis pulsat?
   (20 November 2026), the indefinite pronouns. One engine with a data file per game is the
   coordinating session's choice, for Jack to judge. The page is dressed as the clock (src/hora.html)
   is dressed, which solved the same problems.
   The colours are the lexicon's: the Minium scheme of src/styles.css, with the same names and values,
   copied here so that the page stands by itself, the page on --ground and the cards on --card. The
   roles are the clock's: ink for the text and the main button; red for the rubrics, the control in use,
   and a wrong answer (--rubric for words, --accent for marks, so that in dark the words are cream and
   the marks rose); lapis for a right answer. No other colour.
   Right, wrong, "macrons missing", and "shown" differ in more than colour, in the message line and in
   the gap itself: a right gap is bold, on a lapis tint, over a solid rule, with a tick in the message;
   a wrong one has a dashed red rule and a cross; one with the macrons missing a double red rule and a
   macron; a shown one is italic and grey over a dotted rule, and is not counted. What the reader had
   typed in a gap that "Show" filled stays under it, struck through, beside the pronoun if that is shown.
   The faces are the lexicon's, used as the clock and the practice round use them: Alegreya Sans for
   controls and counters (the buttons, the tabs, the score, the options, the language); Lexicon Serif
   for the Latin text and the gaps; Lexicon Serif in small capitals for rubrics (the line over the
   question, the headings of the options). Which element takes which face is Claude's choice.
   The page asks nothing of other sites, so that it works offline: both faces are the lexicon's own
   files (assets/fonts/), declared here because the page stands by itself. Every control, the gaps
   included, is at least 44px tall; the running text is spaced so that the gaps sit in the line, with
   the pronouns under them when they are shown. */
@font-face{font-family:"Lexicon Serif";src:url(assets/fonts/lexicon-serif-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Lexicon Serif";src:url(assets/fonts/lexicon-serif-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Lexicon Serif";src:url(assets/fonts/lexicon-serif-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(assets/fonts/alegreya-sans-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(assets/fonts/alegreya-sans-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
:root{
  color-scheme:light;
  --paper:#ffffff; --ink:#141414; --soft:#3d3d3d; --muted:#666666; --hair:#dadada; --rule:#141414;
  --rubric:#b0171f; --accent:#b0171f; --mark:#fbe1dd; --ground:#f2f0eb; --card:#ffffff;
  --lapis:#24457a; --lapis-soft:#e1e8f3;
  --serif:"Lexicon Serif","Gentium Book Plus",Gentium,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1c1b19; --ink:#e4dfd6; --soft:#c7c1b6; --muted:#9e988d; --hair:#3a3733; --rule:#615c54;
  --rubric:#d8d1c4; --accent:#d4968a; --mark:#59482a; --ground:#141311; --card:#24221f;
  --lapis:#9db4d6; --lapis-soft:#2a3345;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.4;
  font-feature-settings:"locl" 0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar: the way back to the practice, and the game's name */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--hair)}
.top-in{max-width:600px;margin:0 auto;height:52px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--ink)}
.icon-btn:hover{background:var(--card)}
.top h1{margin:0;font-size:1.25rem;font-weight:500;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{max-width:600px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:max(40px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px}

/* the five questions: one row, as the clock's choice of language is; the control in use is ink,
   underlined in red, as the lexicon's filters are */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.tab{border:0;border-left:1px solid var(--hair);background:var(--ground);color:var(--soft);min-height:44px;padding:6px 2px;
  font:400 1.0625rem/1.2 var(--sans);display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.tab:first-child{border-left:0}
.tab[aria-pressed="true"]{background:var(--card);color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);
  text-decoration-thickness:2px;text-underline-offset:.4em}
.tab .done{display:inline-flex;color:var(--lapis)}
.tab .done svg{width:.8em;height:.8em;display:block}

.card{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0;font:400 1rem/1.2 var(--serif);font-variant-caps:all-small-caps;letter-spacing:.07em;color:var(--rubric)}
.question{margin:0;font-size:2rem;font-weight:400;line-height:1.12;text-wrap:balance}
.sheet-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.task{margin:0;font-size:1rem;color:var(--muted);font-style:italic}
.score{margin:0;font:400 1rem/1.3 var(--sans);color:var(--muted);font-variant-numeric:lining-nums tabular-nums}

/* the dialogue: running text with the gaps written into the line. Each gap is an inline column, the
   field and, when asked for, the pronoun under it, so the line makes room for both and no gap ever
   lies over the line below. */
.prose{margin:0;font-size:1.15rem;line-height:2.1;overflow-wrap:break-word}
.gap{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;margin:3px 0}
.gap input{width:6.4em;height:44px;padding:0 .2em;border:0;border-bottom:2px solid var(--muted);border-radius:6px 6px 0 0;
  background:var(--ground);color:var(--ink);text-align:center;font:inherit;line-height:1.2}
.gap input[readonly]{cursor:default}
.gap input.right{color:var(--lapis);font-weight:700;background:var(--lapis-soft);border-bottom-color:var(--lapis)}
.gap input.wrong{color:var(--rubric);border-bottom:2px dashed var(--accent)}
.gap input.apex{color:var(--rubric);border-bottom:4px double var(--accent)}
.gap input.shown{color:var(--soft);font-style:italic;background:transparent;border-bottom:2px dotted var(--muted)}
.gap .under{display:flex;gap:.45em;justify-content:center;font-size:.62em;line-height:1.15;margin-top:2px;white-space:nowrap}
.gap .hint{display:none;color:var(--muted);font-style:italic}
body.hints .gap .hint{display:inline}
/* what the reader typed where "Show" put the form: kept, struck through, in red */
.gap .was{color:var(--rubric);text-decoration:line-through;text-decoration-color:var(--accent)}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
@media (prefers-reduced-motion:no-preference){.gap input.wrong.fresh,.gap input.apex.fresh{animation:nudge .25s ease-in-out}}

/* the message: a mark beside the words, so that the verdict is more than its colour */
.message{margin:0;min-height:1.5em;font-size:1.05rem}
.message .v svg{display:inline-block;width:.85em;height:.85em;margin-right:.3em;vertical-align:-.06em}
.message.good{color:var(--lapis);font-weight:600}
.message.bad,.message.apex{color:var(--rubric)}
.message.bad svg,.message.apex svg{color:var(--accent)}

.controls{display:flex;flex-wrap:wrap;gap:8px}
.ubtn{min-height:48px;padding:0 16px;border:1px solid var(--rule);background:none;border-radius:8px;color:var(--ink);font:400 1.0625rem/1.2 var(--sans)}
.ubtn.main{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.keys{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.keys-label{font:400 1rem/1.2 var(--sans);color:var(--muted);margin-right:4px}
.keys button{width:44px;height:44px;border:1px solid var(--hair);background:var(--ground);border-radius:8px;font-size:1.2rem}

/* the table of forms (Jack, 20 November 2026: "a table of all the forms for someone who does not know
   them"), closed at first, as the clock's reference is (.ref, .tbl in src/hora.html): a card that
   opens, the table scrolling sideways in its own box so that the page never does. The heads and the
   captions are rubrics, the serif's small capitals; the row's label is the pronoun, in italic; the
   cells are the forms, in ink. */
.ref{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:0 16px}
.ref summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font:400 1.0625rem/1.2 var(--sans)}
.ref .when-open,.ref[open] .when-closed{display:none}
.ref[open] .when-open{display:inline}
.tbl{overflow-x:auto;padding-bottom:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:1rem;margin-bottom:10px}
.tbl caption{text-align:left;padding:8px 0 2px;font:400 1.05rem/1.3 var(--serif);font-variant-caps:all-small-caps;letter-spacing:.06em;color:var(--rubric)}
.tbl th,.tbl td{text-align:left;padding:5px 11px 5px 0;border-bottom:1px solid var(--hair);white-space:nowrap}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl thead th{font:400 .95rem/1.3 var(--serif);font-variant-caps:all-small-caps;letter-spacing:.06em;color:var(--rubric)}
.tbl tbody th{font-weight:400;font-style:italic;color:var(--soft)}

/* the options, the language, and the way back, on the ground under the card */
.grp{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.grp h2{margin:0 0 3px;font:400 1.1rem/1.1 var(--serif);font-variant-caps:small-caps;letter-spacing:.05em;color:var(--rubric)}
.opt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;min-height:44px;padding:6px 0;cursor:pointer;font:400 1.0625rem/1.35 var(--sans)}
.opt input{margin:0;width:18px;height:18px;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair);border-radius:8px;overflow:hidden;max-width:320px}
.seg button{border:0;background:var(--ground);color:var(--soft);min-height:44px;padding:8px;font:400 1.0625rem/1.2 var(--sans)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:.4em}
.links{display:flex;flex-wrap:wrap;column-gap:22px;padding:0 2px}
.links a{display:inline-flex;align-items:center;min-height:44px;color:var(--soft);text-decoration-color:var(--accent);text-underline-offset:.2em}
.links a:hover{color:var(--ink)}

@media (min-width:560px){
  .card{padding:22px}
  .question{font-size:2.3rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="icon-btn" id="back" href="practice.html">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 4.5L7 11l6.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </a>
    <h1 lang="la">{{name}}</h1>
  </div>
</header>

<main>
  <nav class="tabs" id="tabs" lang="la"></nav>

  <section class="card" aria-labelledby="question">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h2 class="question" id="question" lang="la"></h2>
    <div class="sheet-top">
      <p class="task" data-i18n="task"></p>
      <p class="score" id="score" aria-live="polite"></p>
    </div>

    <p class="message" id="message" role="status"></p>
    <div class="controls">
      <button class="ubtn main" id="check" type="button" data-i18n="check"></button>
      <button class="ubtn" id="reveal" type="button" data-i18n="reveal"></button>
      <button class="ubtn" id="reset" type="button" data-i18n="reset"></button>
      <button class="ubtn main" id="next" type="button" data-i18n="next" hidden></button>
    </div>
    <div class="keys" id="keys">
      <span class="keys-label" data-i18n="keys"></span>
      <button type="button" data-ch="ā">ā</button><button type="button" data-ch="ē">ē</button><button type="button" data-ch="ī">ī</button><button type="button" data-ch="ō">ō</button><button type="button" data-ch="ū">ū</button>
    </div>
  </section>

  <details class="ref" id="forms">
    <summary><span class="when-closed" data-i18n="showForms"></span><span class="when-open" data-i18n="hideForms"></span></summary>

  <div class="grp">

  </div>

  <nav class="links" id="links">

    <a href="chartae.html" lang="la">Chartae animālium</a>
{{links}}
  </nav>
</main>

<script>
(function(){
/* The game's data, from its file in src/lacunae/, written in by the builder: its rounds, its line over
   the question in both languages, and the prefix of its storage keys. The dialogues and every Latin
   string of the interface below are Claude's wording (20 November 2026), built on a game Jack invented
   in conversation, for Jack's review: they are not his, and are not approved. The name in the games,
   Theodōrus, is Jack's choice (20 November 2026). Do not change the dialogues without Jack. The rules of
   judging (parse, norm, strip, judge) are the prototype's; since Quis pulsat? norm also reads j as i,
   so that alicuius is taken for alicujus and given the house spelling. "Optiōnēs", "Lingua", and
   "Vocābulōrum exercitātiō" are the clock's own strings (src/hora.html).
   Each gap is {fōrma/altera fōrma|prōnōmen}. The first form is the one shown by "Ostende". */
const GAME = {{game}};
const ROUNDS = GAME.rounds;

function parse(text) {
  const parts = [];
  const re = /\{([^|}]+)\|([^}]*)\}/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push({ forms: m[1].split("/"), hint: m[2] });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts;
}
function norm(s) {
  return s.normalize("NFC").toLowerCase().replace(/\s+/g, "").replace(/cunque/g, "cumque").replace(/j/g, "i");
}
function strip(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "");
}
/* Returns {state: "empty" | "right" | "apex" | "wrong", form} */
function judge(forms, value, strict) {
  const v = norm(value);
  if (!v) return { state: "empty" };
  const exact = forms.findIndex(f => norm(f) === v);
  if (exact >= 0) return { state: "right", form: forms[exact] };
  const bare = forms.findIndex(f => strip(norm(f)) === strip(v));
  if (bare >= 0) return strict ? { state: "apex" } : { state: "right", form: forms[bare] };
  return { state: "wrong" };
}

const T={
 la:{eyebrow:GAME.eyebrow.la,task:'Lacūnās explē.',check:'Probā',reveal:'Ostende',reset:'Dēnuō',next:'Proxima interrogātiō',
   keys:'Apicēs',keysLabel:'Litterae cum apicibus',hints:GAME.hints.la,strict:'Apicēs exigere',
   score:(n,m)=>`Rēctē: ${n} ex ${m}`,wrong:'Nōndum. Iterum temptā.',apex:'Fōrma rēcta est, apicēs dēsunt.',
   perfect:'Euge! Omnia ipse explēvistī.',finished:(n,m)=>`Perfectum est; ${n} ex ${m} ipse explēvistī.`,
   tabs:'Interrogātiōnēs',done:'perfectum',gap:'lacūna',note:'nota',optH:'Optiōnēs',langH:'Lingua',
   back:'Ad exercitātiōnem',links:'Ad lexicon',practice:'Vocābulōrum exercitātiō',
   showForms:'Mōnstrā fōrmās',hideForms:'Cēlā fōrmās'},
 en:{eyebrow:GAME.eyebrow.en,task:'Fill the gaps.',check:'Check',reveal:'Show',reset:'Start over',next:'Next question',
   keys:'Macrons',keysLabel:'Letters with macrons',hints:GAME.hints.en,strict:'Require macrons',
   score:(n,m)=>`Right: ${n} of ${m}`,wrong:'Not yet. Try again.',apex:'The form is right; the macrons are missing.',
   perfect:'Well done! You filled them all yourself.',finished:(n,m)=>`Done; you filled ${n} of ${m} yourself.`,
   tabs:'Questions',done:'done',gap:'gap',note:'hint',optH:'Options',langH:'Language',
   back:'Back to practice',links:'To the lexicon',practice:'Vocabulary practice',
   showForms:'Show the forms',hideForms:'Hide the forms'}
};

/* Everything stays on the device, in localStorage, each access inside try/catch, under the game's own
   prefix: <prefix>hints, <prefix>strict, <prefix>done (uet- for Ubi est Theodōrus?, qp- for Quis pulsat?). The language is the practice page's own choice (lexicon-practice-lang), as the review page's
   is: Latin unless English was chosen there or here. */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(GAME.prefix + key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(GAME.prefix + key, JSON.stringify(value)); } catch (e) {}
  }
};
const LANG = 'lexicon-practice-lang';
let lang = 'la';
try { if (localStorage.getItem(LANG) === 'en') lang = 'en'; } catch (e) {}
const t = k => T[lang][k];

const rounds = ROUNDS.map(r => {
  const parts = parse(r.text);
  const gaps = parts.filter(p => typeof p !== "string");
  return { ...r, parts, gaps, state: gaps.map(() => ({ status: "open", value: "" })) };
});
let done = store.get("done", {});
if (!done || typeof done !== "object") done = {};
let current = 0;
let lastInput = null, lastPos = 0;
let msg = { key: "", kind: "", args: [] };

const el = id => document.getElementById(id);
const $q = el("question"), $tabs = el("tabs"), $prose = el("prose"), $score = el("score"),
      $msg = el("message"), $check = el("check"), $reveal = el("reveal"), $reset = el("reset"),
      $next = el("next"), $hints = el("opt-hints"), $strict = el("opt-strict");

/* the verdict's mark: a tick, a cross, and a macron, as in the clock */
const MARK = { good: 'M5 12.5l4.5 4.5L19 7.5', bad: 'M6 6l12 12M18 6L6 18', apex: 'M5 12h14' };
const markSVG = k => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${MARK[k]}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderTabs() {
  $tabs.textContent = "";
  $tabs.setAttribute("aria-label", t("tabs"));
  rounds.forEach((r, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.dataset.id = r.id;
    b.setAttribute("aria-pressed", i === current ? "true" : "false");
    b.appendChild(document.createTextNode(r.tab));
    if (done[r.id]) {
      const s = document.createElement("span");
      s.className = "done";
      s.setAttribute("role", "img");
      s.setAttribute("aria-label", t("done"));
      s.lang = lang;
      s.innerHTML = markSVG("good");
      b.appendChild(s);
    }
    b.addEventListener("click", () => go(i));
    $tabs.appendChild(b);
  });
}

function inputs() { return Array.from($prose.querySelectorAll("input")); }

/* "gap 3, hint: 5", "lacūna 3, nota: 1 sg. perf.": the hint is named as such, so that a number or a
   tense reads as a hint and not as a count. */
function gapLabel(i, hint) { return t("gap") + " " + (i + 1) + (hint ? ", " + t("note") + ": " + hint : ""); }

function renderRound() {
  const r = rounds[current];
  /* A table of forms that belongs to a round (one verb of Heri, hodiē, crās) is shown only while that
     round is open; the others always. */
  el("forms-body").querySelectorAll("table[data-round]").forEach(table => { table.hidden = table.dataset.round !== r.id; });
  $q.textContent = r.q;
  $prose.textContent = "";
  let n = 0;
  r.parts.forEach(p => {
    if (typeof p === "string") { $prose.appendChild(document.createTextNode(p)); return; }
    const i = n++;
    const wrap = document.createElement("span");
    wrap.className = "gap";
    const inp = document.createElement("input");
    inp.type = "text";
    inp.id = "gap-" + r.id + "-" + i;
    inp.dataset.i = i;
    inp.setAttribute("aria-label", gapLabel(i, p.hint));
    inp.lang = "";
    inp.autocomplete = "off";
    inp.spellcheck = false;
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("autocorrect", "off");
    inp.enterKeyHint = "next";
    const st = r.state[i];
    inp.value = st.value;
    if (st.status !== "open") { inp.readOnly = true; inp.classList.add(st.status); if (st.status !== "wrong") inp.lang = "la"; }
    const under = document.createElement("span");
    under.className = "under";
    const was = document.createElement("span");
    was.className = "was";
    was.lang = "";
    was.textContent = st.was || "";
    was.hidden = !st.was;
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.setAttribute("aria-hidden", "true");
    hint.textContent = p.hint;
    under.appendChild(was);
    under.appendChild(hint);
    wrap.appendChild(inp);
    wrap.appendChild(under);
    $prose.appendChild(wrap);
  });
  setMessage("", "");
  update();
}

function paintMessage() {
  $msg.className = "message" + (msg.kind ? " " + msg.kind : "");
  $msg.textContent = "";
  if (!msg.key) return;
  const v = T[lang][msg.key];
  const text = typeof v === "function" ? v(...msg.args) : v;
  const span = document.createElement("span");
  span.className = "v";
  if (MARK[msg.kind]) span.innerHTML = markSVG(msg.kind);
  span.appendChild(document.createTextNode(text));
  $msg.appendChild(span);
}
function setMessage(key, kind, args) {
  msg = { key, kind, args: args || [] };
  paintMessage();
}

function update() {
  const r = rounds[current];
  const right = r.state.filter(s => s.status === "right").length;
  const open = r.state.filter(s => s.status === "open").length;
  $score.textContent = t("score")(right, r.gaps.length);
  const finished = open === 0;
  $check.hidden = finished;
  $reveal.hidden = finished;
  $next.hidden = !finished;
  if (finished) {
    if (right === r.gaps.length) {
      setMessage("perfect", "good");
      if (!done[r.id]) { done[r.id] = true; store.set("done", done); renderTabs(); }
    } else {
      setMessage("finished", "", [right, r.gaps.length]);
    }
  }
}

/* Judges one gap and paints it. Returns the state. */
function checkOne(inp) {
  const r = rounds[current];
  const i = Number(inp.dataset.i);
  const st = r.state[i];
  if (st.status !== "open") return st.status;
  const res = judge(r.gaps[i].forms, inp.value, $strict.checked);
  inp.classList.remove("wrong", "apex", "fresh");
  if (res.state === "right") {
    st.status = "right";
    st.value = res.form;
    inp.value = res.form;
    inp.readOnly = true;
    inp.lang = "la";
    inp.classList.add("right");
  } else if (res.state === "wrong" || res.state === "apex") {
    st.value = inp.value;
    void inp.offsetWidth;
    inp.classList.add(res.state, "fresh");
  }
  return res.state;
}

function report(states) {
  if (states.includes("wrong")) setMessage("wrong", "bad");
  else if (states.includes("apex")) setMessage("apex", "apex");
  else setMessage("", "");
  update();
}

function focusNextOpen(from) {
  const all = inputs();
  const start = from ? all.indexOf(from) + 1 : 0;
  const order = all.slice(start).concat(all.slice(0, start));
  const target = order.find(x => !x.readOnly);
  if (target) target.focus();
}

function go(i) {
  current = (i + rounds.length) % rounds.length;
  renderTabs();
  renderRound();
  try { history.replaceState(null, "", "#" + rounds[current].id); } catch (e) {}
}

$check.addEventListener("click", () => {
  const states = inputs().filter(x => !x.readOnly).map(checkOne);
  report(states);
});
/* "Ostende" judges what was typed first, by the rules of "Probā": a right answer stays the reader's
   own and is counted; a wrong one (or one without its macrons, when they are required) is kept, struck
   through, under the form shown in its place (Jack, 20 November 2026: the prototype replaced what he
   had typed and not yet checked). */
$reveal.addEventListener("click", () => {
  const r = rounds[current];
  inputs().forEach(inp => {
    const i = Number(inp.dataset.i);
    if (r.state[i].status !== "open") return;
    const typed = inp.value.trim();
    if (typed && checkOne(inp) === "right") return;
    r.state[i] = { status: "shown", value: r.gaps[i].forms[0], was: typed };
    const was = inp.parentNode.querySelector(".was");
    was.textContent = typed;
    was.hidden = !typed;
    inp.value = r.gaps[i].forms[0];
    inp.readOnly = true;
    inp.lang = "la";
    inp.classList.remove("wrong", "apex", "fresh");
    inp.classList.add("shown");
  });
  setMessage("", "");
  update();
});
$reset.addEventListener("click", () => {
  const r = rounds[current];
  r.state = r.gaps.map(() => ({ status: "open", value: "" }));
  renderRound();
});
$next.addEventListener("click", () => {
  go(current + 1);
  window.scrollTo({ top: 0 });
});

$prose.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  e.preventDefault();
  const state = checkOne(e.target);
  report([state]);
  if (state === "right" || state === "empty") focusNextOpen(e.target);
});
$prose.addEventListener("input", e => {
  if (e.target.tagName !== "INPUT") return;
  e.target.classList.remove("wrong", "apex", "fresh");
  rounds[current].state[Number(e.target.dataset.i)].value = e.target.value;
});
$prose.addEventListener("focusin", e => { if (e.target.tagName === "INPUT") lastInput = e.target; });
$prose.addEventListener("focusout", e => {
  if (e.target.tagName === "INPUT") lastPos = e.target.selectionStart ?? e.target.value.length;
});

/* The macron keys write into the gap last in use. A press does not take the focus from the gap, so
   that a phone's keyboard stays open, as in the clock; the place is then read from the gap itself. */
el("keys").addEventListener("pointerdown", e => { if (e.target.closest("button")) e.preventDefault(); });
el("keys").addEventListener("click", e => {
  const ch = e.target.dataset && e.target.dataset.ch;
  if (!ch) return;
  let inp = lastInput && document.body.contains(lastInput) && !lastInput.readOnly ? lastInput : null;
  if (!inp) { inp = inputs().find(x => !x.readOnly); lastPos = inp ? inp.value.length : 0; }
  if (!inp) return;
  if (document.activeElement === inp) lastPos = inp.selectionStart ?? inp.value.length;
  const pos = Math.min(lastPos, inp.value.length);
  inp.value = inp.value.slice(0, pos) + ch + inp.value.slice(pos);
  inp.dispatchEvent(new Event("input", { bubbles: true }));
  inp.focus();
  lastPos = pos + ch.length;
  inp.setSelectionRange(lastPos, lastPos);
});

$hints.checked = store.get("hints", false) === true;
$strict.checked = store.get("strict", false) === true;
document.body.classList.toggle("hints", $hints.checked);
$hints.addEventListener("change", () => {
  document.body.classList.toggle("hints", $hints.checked);
  store.set("hints", $hints.checked);
});
$strict.addEventListener("change", () => store.set("strict", $strict.checked));

/* The language: the page's lang follows the interface; the Latin (the name, the tabs, the question,
   the dialogue, and the forms the game wrote) carries lang="la" whatever it is. */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(node => { node.textContent = t(node.dataset.i18n); });
  el("keys").setAttribute("aria-label", t("keysLabel"));
  el("back").setAttribute("aria-label", t("back"));
  el("back").title = t("back");
  el("links").setAttribute("aria-label", t("links"));
  el("lang").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const r = rounds[current];
  inputs().forEach(inp => { const i = Number(inp.dataset.i); inp.setAttribute("aria-label", gapLabel(i, r.gaps[i].hint)); });
  renderTabs();
  $score.textContent = t("score")(r.state.filter(s => s.status === "right").length, r.gaps.length);
  paintMessage();
}
el("lang").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem(LANG, lang); } catch (e) {}
  applyLang();
}));

function fromHash() {
  const id = (location.hash || "").replace("#", "");
  const i = rounds.findIndex(r => r.id === id);
  return i >= 0 ? i : 0;
}
window.addEventListener("hashchange", () => {
  const i = fromHash();
  if (i !== current) { current = i; renderTabs(); renderRound(); }
});
/* The table of forms, behind "Mōnstrā fōrmās" (Jack's words, 20 November 2026; "Cēlā fōrmās" and the
   English are Claude's): the game's tables, the first cell of a row its label. The forms, the captions,
   and the heads are Latin in both interfaces. It opens closed on every visit, and whether it is open is
   not kept; a change of round leaves it as it is, and a table that belongs to a round follows the round.
   The tables are Claude's compilation, for Jack's review. */
GAME.tabulae.forEach(t => {
  const table = document.createElement("table");
  if (t.round) table.dataset.round = t.round;
  if (t.caption) { const c = document.createElement("caption"); c.textContent = t.caption; table.appendChild(c); }
  const thead = document.createElement("thead"), hr = document.createElement("tr");
  t.heads.forEach(h => { const th = document.createElement("th"); th.scope = "col"; th.textContent = h; hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement("tbody");
  t.rows.forEach(r => {
    const tr = document.createElement("tr");
    r.forEach((cell, i) => { const c = document.createElement(i ? "td" : "th"); if (!i) c.scope = "row"; c.textContent = cell; tr.appendChild(c); });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); el("forms-body").appendChild(table);
});

current = fromHash();
renderRound();
applyLang();

/* The lexicon's service worker keeps this page on the device with the rest, so the game works offline. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
</body>
</html>
